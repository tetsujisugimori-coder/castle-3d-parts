<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>

<body><main>
<p>城郭3D部品ライブラリ / Stage 4-A 第2便・非公開開発用</p>
<h1>GLB配置試作</h1>
<p class="note">試作D・参照模型。接続点の一致だけを確認します。史実・強度・実Solid安全性・連続開閉の保証はありません。山中城への配置ではありません。</p>
<div id="viewport" role="img" aria-label="木柵、簡易木戸、木柵の配置。ドラッグで視点回転、ピンチで拡大縮小。緑の球は接続点の目印です。"></div>
