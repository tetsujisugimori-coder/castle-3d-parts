name: CAD contract source completeness (separate from protected legacy workflow)
on:
  pull_request:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect exact tracked source including hidden paths
        run: |
          mkdir -p cad-contract-complete/source
          git ls-files -z | xargs -0 sha256sum > cad-contract-complete/manifest.sha256
          git archive HEAD | tar -x -C cad-contract-complete/source
      - name: Verify source before upload and run historical-missing fault controls
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_verify_cad_contract_archive.py' -v > cad-contract-complete/fault-tests.log 2>&1 || { cat cad-contract-complete/fault-tests.log; exit 1; }
          python3 -B scripts/verify_cad_contract_archive.py --repo . --artifact-dir cad-contract-complete --report cad-contract-complete/source-audit-pre.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-contract-complete-${{ github.event.pull_request.head.sha }}
          path: cad-contract-complete/
          if-no-files-found: error
          include-hidden-files: true
  readback:
    needs: collect
    if: ${{ needs.collect.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cad-contract-complete-${{ github.event.pull_request.head.sha }}
          path: cad-contract-readback
      - name: Verify downloaded bytes against Git tree and pre-upload audit
        run: |
          python3 -B scripts/verify_cad_contract_archive.py --repo . --artifact-dir cad-contract-readback --prior cad-contract-readback/source-audit-pre.json --report cad-contract-readback-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-contract-complete-audit-${{ github.event.pull_request.head.sha }}
          path: cad-contract-readback-report.json
          if-no-files-found: error
