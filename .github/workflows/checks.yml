name: Validate prototype
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/observation-evidence.mjs evidence-run
      - run: test -s dist/index.html && test -s dist/data/wooden-palisade-v0.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observation-register-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence-run/
          if-no-files-found: error
