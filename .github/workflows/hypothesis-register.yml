name: Validate comparison and hypothesis register
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate, preserve and capture evidence
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/hypothesis-evidence.mjs hypothesis-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hypothesis-register-${{ github.event.pull_request.head.sha || github.sha }}
          path: hypothesis-evidence/
          if-no-files-found: error
